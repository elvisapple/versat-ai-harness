$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:versat:sdd:proposal
title: Versat SDD version 2 proposal metadata
type: object
additionalProperties: false
required: [sdd_version, change, status, owner, summary, review]
properties:
  sdd_version: {const: 2}
  change:
    $ref: 'urn:versat:sdd:common#/$defs/change'
  status:
    enum: [draft, proposed, accepted, rejected, implemented, archived]
  owner:
    $ref: 'urn:versat:sdd:common#/$defs/text'
  summary:
    $ref: 'urn:versat:sdd:common#/$defs/text'
  risk:
    enum: [low, medium, high]
  review:
    allOf:
      - $ref: 'urn:versat:sdd:common#/$defs/review'
      - properties:
          upstream: {maxProperties: 0}
