$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:versat:sdd:v3:design
title: Versat SDD version 3 design metadata
type: object
additionalProperties: false
required:
- sdd_version
- change
- requirements
- validation
- review
- coverage
- regression
properties:
  sdd_version:
    const: 3
  change:
    $ref: urn:versat:sdd:common#/$defs/change
  requirements:
    $ref: urn:versat:sdd:common#/$defs/requirementIds
  adrs:
    type: array
    uniqueItems: true
    items:
      $ref: urn:versat:sdd:common#/$defs/text
  validation:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - description
      - requirements
      - required
      - method
      - inputs
      - outputs
      - execution
      properties:
        id:
          type: string
          pattern: ^CHECK-[0-9]{3,}$
        description:
          $ref: urn:versat:sdd:common#/$defs/text
        requirements:
          $ref: urn:versat:sdd:common#/$defs/requirementIds
        required:
          type: boolean
        method:
          type: object
          additionalProperties: false
          required:
          - kind
          - procedure
          properties:
            kind:
              enum:
              - automated
              - manual
              - review
            procedure: &id001
              type: string
              minLength: 1
              pattern: \S
            reason: *id001
        inputs:
          type: object
          additionalProperties: false
          required:
          - include
          - exclude
          properties:
            include:
              type: array
              minItems: 1
              items: *id001
              uniqueItems: true
            exclude:
              type: array
              minItems: 0
              items: *id001
              uniqueItems: true
        outputs:
          type: array
          minItems: 0
          items: *id001
          uniqueItems: true
        execution:
          enum:
          - local
          - ci
  review:
    allOf:
    - $ref: urn:versat:sdd:common#/$defs/review
    - properties:
        upstream:
          required:
          - proposal
          maxProperties: 1
  coverage:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - scenario
      - applicability
      - checks
      properties:
        scenario:
          type: object
          additionalProperties: false
          required:
          - requirement
          - scenario
          properties:
            requirement:
              type: string
              pattern: ^REQ-[0-9]{3,}$
            scenario:
              type: integer
              minimum: 1
        applicability:
          enum:
          - required
          - not-applicable
        checks:
          type: array
          minItems: 0
          items:
            type: string
            pattern: ^CHECK-[0-9]{3,}$
          uniqueItems: true
        reason: *id001
  regression:
    type: array
    minItems: 0
    items:
      type: object
      additionalProperties: false
      required:
      - obligation
      - checks
      - rationale
      properties:
        obligation:
          type: object
          additionalProperties: false
          required:
          - impact
          - scenario
          properties:
            impact:
              type: integer
              minimum: 1
            scenario:
              type: integer
              minimum: 0
        checks:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^CHECK-[0-9]{3,}$
          uniqueItems: true
        rationale: *id001
