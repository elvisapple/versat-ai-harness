# Authoring reference: populate exact repository/SHA and reviewed dependency setup during adoption.
name: Validate project
on: [pull_request, push]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: versat-labs/versat-ai-harness
          ref: REPLACE_WITH_REVIEWED_FULL_COMMIT_SHA
          path: .harness-provider
          persist-credentials: false
      - name: Prepare dependencies explicitly
        run: python -m pip install -r .harness-provider/requirements-validation.txt
      - name: Run every required suite
        env:
          VERSAT_HARNESS_ROOT: ${{ github.workspace }}/.harness-provider
        run: bash scripts/validate/run.sh --execution ci
