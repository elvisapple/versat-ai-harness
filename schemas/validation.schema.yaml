{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Versat validation version 1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema_version": {
      "const": 1
    },
    "required_suites": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "string",
        "pattern": "^[a-z][a-z0-9-]*$"
      }
    },
    "suites": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]*$"
          },
          "kind": {
            "enum": [
              "tests",
              "check"
            ]
          },
          "argv": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string",
              "minLength": 1,
              "pattern": "\\S"
            }
          },
          "cwd": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3600
          },
          "environment": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Z][A-Z0-9_]*$"
            }
          },
          "result": {
            "enum": [
              "unittest",
              "json-v1",
              "exit-code"
            ]
          }
        },
        "required": [
          "id",
          "kind",
          "argv",
          "cwd",
          "timeout_seconds",
          "result"
        ]
      }
    },
    "inputs": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "include": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "uniqueItems": true,
          "minItems": 1
        },
        "exclude": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "uniqueItems": true
        }
      },
      "required": [
        "include",
        "exclude"
      ]
    }
  },
  "required": [
    "schema_version",
    "required_suites",
    "suites",
    "inputs"
  ]
}
