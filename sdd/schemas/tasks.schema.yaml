$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:versat:sdd:tasks
title: Versat SDD version 2 task collection
type: object
additionalProperties: false
required: [sdd_version, change, tasks, review, validation, closure]
properties:
  sdd_version: {const: 2}
  change:
    $ref: 'urn:versat:sdd:common#/$defs/change'
  tasks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, description, requirements, status]
      properties:
        id:
          type: string
          pattern: '^TASK-[0-9]{3,}$'
        description:
          $ref: 'urn:versat:sdd:common#/$defs/text'
        requirements:
          $ref: 'urn:versat:sdd:common#/$defs/requirementIds'
        status:
          enum: [pending, in-progress, blocked, completed]
  review:
    allOf:
      - $ref: 'urn:versat:sdd:common#/$defs/review'
      - properties:
          upstream:
            required: [proposal, design]
  validation:
    type: object
    additionalProperties: false
    required: [plan_digest, results]
    properties:
      plan_digest:
        oneOf:
          - type: 'null'
          - $ref: 'urn:versat:sdd:common#/$defs/digest'
      results:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [check, result, evidence, revision]
          properties:
            check:
              type: string
              pattern: '^CHECK-[0-9]{3,}$'
            result:
              enum: [pass, fail, unverified]
            evidence:
              $ref: 'urn:versat:sdd:common#/$defs/text'
            revision:
              $ref: 'urn:versat:sdd:common#/$defs/text'
  closure:
    enum: [active, prepared]
